<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Transaction | PennyTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>Edit Transaction</h1>
    <p>Update your income or expense details.</p>
  </header>

  <main>
    <section class="add-transaction">
      <h2>Update Transaction</h2>

      <form method="POST">
        <label for="amount">Amount (₦)</label>
        <input 
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            step="0.01"
            value="{{ transaction.amount }}"
            required
        >
        <label for="type">Transaction Type</label>
        <select id="type"name="type"required>
          <option value="income"
            {% if transaction.type== "income" %}selected{% endif %}>
            Income
          </option>

          <option value="expense"
            {% if transaction.type== "expense" %}selected{% endif %}>
            Expense
          </option>
        </select>

        <label for="category">Category</label>
        <input 
            type="text"
            id="category"
            name="category"
            value="{{ transaction.category }}"
            required
        >

        <label for="description">Description</label>
        <input 
            type="text"
            id="description"
            name="description"
            value="{{ transaction.description }}"
            required
        >

        <button type="submit">Save Changes</button>
      </form>

      <p>
        <a href="{{ url_for('home')}}">Cancel and return to dashboard</a>
      </p>
    </section>
  </main>
</body>
</html>
